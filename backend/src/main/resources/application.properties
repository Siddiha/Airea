spring.datasource.url=${SUPABASE_URL:jdbc:postgresql://aws-1-ap-south-1.pooler.supabase.com:6543/postgres?sslmode=require&prepareThreshold=0}
spring.datasource.username=${SUPABASE_USERNAME:postgres.tzlosvcspgnmtcmjjlut}
spring.datasource.password=${SUPABASE_PASSWORD:Siddika123@}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Settings (fixes Supabase prepared statement issue)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.auto-commit=false

# PostgreSQL specific - disable prepared statement caching for Supabase pooler
spring.datasource.hikari.data-source-properties.prepareThreshold=0

# CORS Configuration
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080,http://localhost:5173}

# Server Configuration (Railway sets PORT env variable)
server.port=${PORT:8080}

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false


# Logging
logging.level.root=INFO
logging.level.service=INFO
logging.level.controller=INFO
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.type.descriptor.sql=OFF