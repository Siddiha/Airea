# Local H2 Database Configuration (In-Memory)
spring.datasource.url=jdbc:h2:mem:airea_db
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# H2 Console (Optional - for viewing database)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT Configuration
jwt.secret=airea-super-secret-key-change-this-in-production-minimum-256-bits
jwt.expiration=86400000

# CORS Configuration
cors.allowed.origins=http://localhost:3000,http://localhost:8080,http://localhost:5173

# Server Configuration
server.port=8080

# JPA/Hibernate - Use H2 Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Logging
logging.level.root=INFO
logging.level.security=DEBUG
logging.level.service=DEBUG
logging.level.controller=DEBUG
