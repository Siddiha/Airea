name: airea_cough_monitor
description: Simple Airea Cough Monitor

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  
  # Networking
  http: ^1.1.0
  
  # State Management & Storage
  provider: ^6.1.1
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2
  
  # Charts & UI
  fl_chart: ^0.66.0
  percent_indicator: ^4.2.3
  intl: ^0.19.0

  # Files (Updated to fix the crash)
  file_picker: ^8.0.0
  open_filex: ^4.3.2
  path: ^1.9.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/